name: Windows build and isolated validation
on:
  push:
    branches: [windows-port]
    paths-ignore: ['**.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_HOME: ${{ github.workspace }}/.cache/dotnet-home
      NUGET_PACKAGES: ${{ github.workspace }}/.cache/nuget
      PYTHONUTF8: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned Microsoft SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.403'
      - name: Verify official runtime archives
        run: python scripts/fetch-windows-runtime.py --include-installer
      - name: Verify Windows private storage before running regressions
        timeout-minutes: 2
        run: '& .cache/windows-runtime/x64/bin/node.exe scripts/windows-acl-preflight.mjs'
      - name: Verify official Codex protocol in an empty isolated home
        timeout-minutes: 2
        run: '& .cache/windows-runtime/x64/bin/node.exe scripts/windows-codex-preflight.mjs'
      - name: Run shared backend regressions on Windows
        timeout-minutes: 12
        run: python scripts/run-windows-backend-tests.py
      - name: Build native application, portable ZIP and installer
        id: package
        run: python scripts/package-windows.py
      - name: Validate isolated native UI and bundled services
        run: '& .cache/windows-runtime/x64/bin/node.exe scripts/validate-windows.mjs --app "dist/windows-x64/Whale Pet" --output build/windows-validation'
      - name: Verify installed payload, privacy and provenance
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: python scripts/audit-windows.py
      - name: Finalize checksums and clean source archive
        run: python scripts/finalize-windows-release.py
      - name: Upload rendered synthetic UI and reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-validation
          path: build/windows-validation/
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload distributable assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release
          path: dist/windows/*
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
